services:
  postgres:
    image: postgres:16-alpine
    container_name: crm-saas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: crm_master_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/prisma/seeds/init-local-databases.sql:/docker-entrypoint-initdb.d/init-local-databases.sql:ro

volumes:
  postgres_data:
